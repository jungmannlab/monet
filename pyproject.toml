[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monet"
dynamic = ["version"]
description = "A Python based software suite to calibrate laser power for microscopy systems."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "Heinrich Grabmayr", email = "hgrabmayr@biochem.mpg.de" },
]
keywords = ["laser", "power", "calibration", "microscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

# Core runtime dependencies: everything imported eagerly by the package and
# needed to run calibrations/analysis against the simulated `Test*` hardware.
dependencies = [
    "numpy>=1.23",
    "pandas>=2.3",
    "lmfit>=1.3",
    "matplotlib>=3.10",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "icecream>=2.1",
    "requests>=2.31",
    "importlib_resources>=5.0",
    # SQLAlchemy is imported eagerly via monet.io -> monet.cache -> monet.models
    # (the local SQLite cache/outbox that backs the HTTP database mode), so it is
    # required to import the core workflow even when only the Excel DB is used.
    "sqlalchemy>=2.0",
    # pyserial is imported eagerly by monet.attenuation (top-level `import
    # serial`), which is loaded whenever a control is built — including with the
    # test attenuator — so it is a core dependency, not hardware-only.
    "pyserial>=3.5",
]

[project.optional-dependencies]
# PyQt6 GUI and the embeddable `monet.qt` widgets.
gui = [
    "PyQt6>=6.5",
]

# FastAPI calibration server (`python -m monet serve`). SQLAlchemy is a core
# dependency (see above), so only the web-server packages live here.
#
# picasso-registry[auth] is the shared service-auth helper (WP-3b / ADR-001):
# monet imports `picasso_registry.auth` rather than reimplementing bearer-token
# auth, so the two DNA-PAINT services share one audited implementation. The
# [auth] extra is only FastAPI (already required here), so this adds no runtime
# weight beyond the small pure-Python package itself.
server = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "picasso-registry[auth] @ git+https://github.com/jungmannlab/picasso-registry.git",
]

# Real-hardware SDKs. All imported lazily, so they are only required on the
# machines that actually drive the instruments. msl-equipment and pycobolt have
# no PyPI release and are pulled directly from their published artifacts.
# (ThorlabsTLPMPowerMeter additionally needs Thorlabs' TLPM.py wrapper, vendored
# as monet/TLPM.py — it ships with the Optical Power Monitor SDK, not via pip.)
hardware = [
    "pyvisa>=1.15",
    "ThorlabsPM100>=1.2.2",
    "microscope>=0.7",
    "nidaqmx>=1.2",
    "pycromanager",
    "pycobolt @ git+https://github.com/cobolt-lasers/pycobolt.git",
    "msl-equipment @ https://github.com/MSLNZ/msl-equipment/releases/download/v0.2.0/msl_equipment-0.2.0-py3-none-any.whl",
]

# Test / development tooling. black is pinned so a manual run and the
# pre-commit hook (see .pre-commit-config.yaml) agree; flake8 reads its config
# from [tool.flake8] below via the Flake8-pyproject plugin.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage>=7.10",
    "httpx>=0.25",
    "black==26.5.1",
    "flake8>=7",
    "Flake8-pyproject>=1.2",
    "pre-commit>=3.7",
]

# Convenience aggregate of every optional group.
all = [
    "monet[gui]",
    "monet[server]",
    "monet[hardware]",
    "monet[dev]",
]

[project.urls]
Homepage = "https://github.com/Heerpa/monet"
Repository = "https://github.com/Heerpa/monet"

[project.scripts]
monet = "monet.__main__:main"

[tool.setuptools_scm]
# Writes the version into a file that is importable at runtime, even when
# installed from a wheel or sdist (i.e. without a .git directory).
write_to = "monet/_version.py"
# Shown when the package is imported outside a git repository and no tag
# is reachable (e.g. a fresh checkout with no tags yet).
fallback_version = "0.3.6"

[tool.setuptools.packages.find]
include = ["monet*"]

[tool.setuptools.package-data]
# Vendored Thorlabs TLPM wrapper, when present alongside the package.
monet = ["TLPM.py"]

[tool.pytest.ini_options]
testpaths = ["monet/tests"]
addopts = "--cov=monet"
filterwarnings = [
    # Starlette's TestClient warns that pairing it with httpx is deprecated
    # (it wants the future `httpx2`). Raised from inside FastAPI/Starlette,
    # not our code — silence it so our own warnings stay visible.
    # (`StarletteDeprecationWarning` subclasses `UserWarning`, not `DeprecationWarning`.)
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.coverage.run]
source = ["monet"]
omit = ["monet/tests/*"]

[tool.black]
target-version = ["py310"]
line-length = 79
# Vendored Thorlabs wrapper and the setuptools-scm generated version file are
# not our code / are machine-written — keep black off them.
extend-exclude = '(monet/TLPM\.py|monet/_version\.py)'

[tool.flake8]
# Stock flake8 only (E/W = pycodestyle, F = pyflakes, C90 = complexity). Line
# length is owned by black, so E501 is ignored here (black already wraps code;
# long strings/comments it can't split -- e.g. dashboard.py's embedded
# HTML/CSS/JS -- are intentional). E203/W503 are the standard black-
# compatibility ignores.
extend-ignore = "E203,E501,W503"
# extend-exclude keeps flake8's sensible defaults and additionally skips the
# vendored Thorlabs wrapper (ships with the OPM SDK) and the setuptools-scm
# generated _version.py.
extend-exclude = "monet/TLPM.py,monet/_version.py"
