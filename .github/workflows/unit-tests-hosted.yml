name: Unit Tests (hosted)

# Fast, hermetic unit tests on a cheap GitHub-hosted runner -- the REQUIRED
# status check (with "Lint") that gates merges into develop/master. monet has no
# self-hosted / on-instrument CI tier; the whole suite runs against the
# simulated Test* hardware, so nothing here needs lab instruments, drivers,
# machine-specific config, or network.
#
# Setup mirrors the headless dev container:
#   * base `pip install -e .` stays wheel-only (real-instrument SDKs live in the
#     [hardware] extra and are lazy-imported); the suite additionally needs
#     [dev] (pytest+cov), [server] (FastAPI for the server/dashboard/io_http
#     tests) and [gui] (PyQt6). pyserial is a base dependency.
#   * the GUI toolkit is lazy-imported, so `import monet` works without a
#     display; the Qt runtime libs + QT_QPA_PLATFORM=offscreen let the PyQt6
#     GUI unit test actually run headlessly instead of skipping.
# `pytest` runs the full suite (coverage config lives in pyproject.toml addopts).

on:
  push:
    branches:
      - master
      - main
      - develop
  # No branch filter on pull_request: run the gate on PRs into every branch
  # (feature/release branches too), matching the pre-split ci.yml behaviour.
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # Test the declared-supported Python range, not just the floor (3.10). Both
    # matrix legs report their own status check ("unit-tests (3.10)" /
    # "unit-tests (3.12)") -- add both to the required-checks list.
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm needs full history for the version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries (headless PyQt6 import)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install package (wheel-only base + test/server/gui extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server,gui]"

      - name: Run unit tests
        run: pytest
