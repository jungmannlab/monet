name: Release — Windows GUI installer

# Builds the standalone Windows GUI executable (monet-gui.exe) and attaches it
# to the GitHub Release for the pushed tag. Fires on a vX.Y.Z tag push — the
# same action that already cuts a monet release (setuptools-scm derives the
# version from the tag). The lint + unit-test gates run on branches/PRs; this
# only runs post-merge, on the tag.

on:
  push:
    tags:
      - 'v*'
  # Manual trigger so the Windows build can be smoke-tested without cutting a
  # real release (the Release-asset upload below is gated to tag runs only).
  workflow_dispatch:

permissions:
  contents: write   # create/update the Release and upload the exe asset

jobs:
  windows-exe:
    runs-on: windows-latest
    # Surface the (optional) code-signing secrets as env so step-level `if:`
    # can test them — the `secrets` context is not available in a step `if`.
    env:
      WINDOWS_CODESIGN_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 }}
      WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # setuptools-scm needs history + the tag for the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Build the embeddable bundle (no PyInstaller, no custom .exe)
        # Assembles dist\monet-gui\ from the PSF-signed embeddable CPython + a
        # real `pip install .[gui,hardware,setup]` into it. [hardware] bundles
        # the vendor SDK *Python* packages (pyvisa, nidaqmx, pycobolt, …) so a
        # real rig can connect (the vendor DLLs/runtimes still live on the rig
        # PC); [setup] bundles paramiko for the wizard's SSH server install.
        # The runner's `python` only pins the matching embeddable version.
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pwsh packaging\build-embedded.ps1

      - name: Confirm the bundled version matches the tag
        shell: bash
        run: |
          # Ask the *bundled* interpreter — that's what ships.
          ver=$(./dist/monet-gui/python.exe -c "import monet; print(monet.__version__)")
          echo "monet version: $ver"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "release tag: $tag"
            if [ "$ver" != "$tag" ]; then
              echo "::error::bundled version ($ver) != tag ($tag) — setuptools-scm/tag mismatch (is fetch-depth:0 and the tag present?)"
              exit 1
            fi
          fi

      - name: Smoke-check the artifact (bundle contains monet + drivers)
        shell: bash
        run: |
          test -f dist/monet-gui/pythonw.exe
          test -f dist/monet-gui/monet_gui.py
          # Headless import check via the bundled interpreter: fails the release
          # if monet or a dynamically-loaded driver module is missing from the
          # embedded install.
          ./dist/monet-gui/python.exe dist/monet-gui/monet_gui.py --selfcheck

      - name: Build the Windows installer (Inno Setup)
        # PowerShell, not bash: Git-Bash's MSYS path conversion mangles the
        # leading-slash ``/DMyAppVersion=...`` flag into a second filename, which
        # ISCC rejects ("You may not specify more than one script filename").
        shell: pwsh
        run: |
          # Version for the installer filename / Add-Remove-Programs entry:
          # the tag on a release run, else the bundled version.
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            # monet lives only in the bundle now, not the runner's python.
            $ver = (& "dist\monet-gui\python.exe" -c "import monet; print(monet.__version__)").Trim()
          }
          Write-Host "installer version: $ver"
          # Inno Setup 6 ships on windows-latest; install to be robust to image
          # changes (a no-op "already installed" otherwise).
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" "packaging\monet-gui.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          if (-not (Test-Path "dist\Monet-Setup-$ver.exe")) {
            throw "installer not found: dist\Monet-Setup-$ver.exe"
          }
          # Zip the embeddable bundle folder as the portable artifact (unzip and
          # run "Monet GUI.cmd" or pythonw.exe monet_gui.py — no install needed).
          Compress-Archive -Path dist\monet-gui -DestinationPath "dist\monet-gui-portable-$ver.zip" -Force

      - name: Code-sign the installer (optional — only if a cert secret is set)
        # The bundle itself ships no custom .exe (the app launches via the
        # PSF-signed pythonw.exe), so nothing inside needs signing. The Inno
        # installer is the one PE we emit; sign it when a code-signing cert is
        # configured so it also carries publisher trust / reputation. Skipped
        # (no-op) when the secret is absent, so forks and cert-less builds work.
        if: ${{ env.WINDOWS_CODESIGN_PFX_B64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          Get-ChildItem dist\Monet-Setup-*.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CODESIGN_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }
          }
          Remove-Item $pfx -Force

      - name: Upload installer + portable zip as build artifacts (always)
        uses: actions/upload-artifact@v6
        with:
          name: monet-gui-windows
          path: |
            dist/Monet-Setup-*.exe
            dist/monet-gui-portable-*.zip
          if-no-files-found: error

      - name: Attach installer + portable zip to the GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # Attaches to the Release for this tag, creating it if it does not
          # exist yet and updating it (without clobbering notes) if it does.
          # The one-click installer plus a zip of the portable onedir folder.
          files: |
            dist/Monet-Setup-*.exe
            dist/monet-gui-portable-*.zip
          fail_on_unmatched_files: true
