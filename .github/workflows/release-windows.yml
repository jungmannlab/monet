name: Release — Windows GUI installer

# Builds the standalone Windows GUI executable (monet-gui.exe) and attaches it
# to the GitHub Release for the pushed tag. Fires on a vX.Y.Z tag push — the
# same action that already cuts a monet release (setuptools-scm derives the
# version from the tag). The lint + unit-test gates run on branches/PRs; this
# only runs post-merge, on the tag.

on:
  push:
    tags:
      - 'v*'
  # Manual trigger so the Windows build can be smoke-tested without cutting a
  # real release (the Release-asset upload below is gated to tag runs only).
  workflow_dispatch:

permissions:
  contents: write   # create/update the Release and upload the exe asset

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # setuptools-scm needs history + the tag for the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install monet (GUI + hardware + setup extras) + PyInstaller
        # [hardware] as well as [gui]: the frozen build bundles the vendor SDK
        # *Python* packages (msl-equipment, pyvisa, nidaqmx, pycobolt, …) so a
        # real rig can connect. The vendor DLLs/runtimes (Thorlabs Kinesis,
        # NI-DAQmx, Micro-Manager) still have to be installed on the rig PC.
        # [setup] bundles paramiko so the wizard's automated SSH server install
        # works from the installed exe (no separate `pip install monet[setup]`).
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,hardware,setup]" pyinstaller

      - name: Confirm the bundled version matches the tag
        shell: bash
        run: |
          ver=$(python -c "import monet; print(monet.__version__)")
          echo "monet version: $ver"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "release tag: $tag"
            if [ "$ver" != "$tag" ]; then
              echo "::error::bundled version ($ver) != tag ($tag) — setuptools-scm/tag mismatch (is fetch-depth:0 and the tag present?)"
              exit 1
            fi
          fi

      - name: Build monet-gui (onedir)
        run: pyinstaller --clean --noconfirm packaging/monet-gui.spec

      - name: Smoke-check the artifact (bundle contains monet + drivers)
        shell: bash
        run: |
          # Onedir: the exe lives inside the dist/monet-gui/ folder.
          test -f dist/monet-gui/monet-gui.exe
          # Headless import check: fails the release if a dynamically-loaded
          # driver module didn't make it into the frozen bundle.
          ./dist/monet-gui/monet-gui.exe --selfcheck

      - name: Build the Windows installer (Inno Setup)
        # PowerShell, not bash: Git-Bash's MSYS path conversion mangles the
        # leading-slash ``/DMyAppVersion=...`` flag into a second filename, which
        # ISCC rejects ("You may not specify more than one script filename").
        shell: pwsh
        run: |
          # Version for the installer filename / Add-Remove-Programs entry:
          # the tag on a release run, else the bundled version.
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $ver = (python -c "import monet; print(monet.__version__)").Trim()
          }
          Write-Host "installer version: $ver"
          # Inno Setup 6 ships on windows-latest; install to be robust to image
          # changes (a no-op "already installed" otherwise).
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" "packaging\monet-gui.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          if (-not (Test-Path "dist\Monet-Setup-$ver.exe")) {
            throw "installer not found: dist\Monet-Setup-$ver.exe"
          }
          # Zip the onedir folder as the portable artifact (the onefile exe is
          # gone — onedir avoids the per-launch temp-extraction DLL-load issue).
          Compress-Archive -Path dist\monet-gui -DestinationPath "dist\monet-gui-portable-$ver.zip" -Force

      - name: Upload installer + portable zip as build artifacts (always)
        uses: actions/upload-artifact@v6
        with:
          name: monet-gui-windows
          path: |
            dist/Monet-Setup-*.exe
            dist/monet-gui-portable-*.zip
          if-no-files-found: error

      - name: Attach installer + portable zip to the GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # Attaches to the Release for this tag, creating it if it does not
          # exist yet and updating it (without clobbering notes) if it does.
          # The one-click installer plus a zip of the portable onedir folder.
          files: |
            dist/Monet-Setup-*.exe
            dist/monet-gui-portable-*.zip
          fail_on_unmatched_files: true
