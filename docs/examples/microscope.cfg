# ============================================================================
# microscope.cfg — Micro-Manager hardware configuration (example / template)
#
# Load this in Micro-Manager (File > Load Hardware Configuration), then start
# the pycromanager gateway (Tools > Options > "Run server on port 4827").
# monet's beam-path drivers connect to whatever MM has loaded — monet does NOT
# load a .cfg itself.
#
# WHY THIS FILE MATTERS FOR MONET
# -------------------------------
# monet finds Micro-Manager settings BY NAME. The names below are the contract:
#
#   * Config group  "Filter turret"  <- monet.beampath.NikonFilterWheel
#   * Config group  "Nosepiece"      <- monet.beampath.NikonNosepiece
#   * The Core "Shutter" role         <- monet.beampath.NikonShutter
#   * Preset names in "Filter turret" (Ti488setting / Ti561setting /
#     Ti640setting) MUST equal the `DC:` strings in protocols.yaml -> Voyager.
#     A mismatch makes monet raise "Position 'Ti488setting' not available ...".
#
# This template is built on the built-in DemoCamera devices so it LOADS AND
# RUNS with no real hardware — you can exercise the full monet<->MM path in
# simulation. To use a real Nikon Ti2, replace the DemoCamera `Device` lines
# with the Ti2 devices from the Hardware Configuration Wizard (see the
# commented block at the bottom) but KEEP the group / preset / role names.
# ============================================================================


# Reset
Property,Core,Initialize,0

# Devices
Device,COM7,SerialManager,COM7
Device,Ti2-E,NikonTi2,Ti2-E__0
Device,ZDrive,NikonTi2,ZDrive
