Device,IntermediateMagnification,NikonTi2,IntermediateMagnification
Device,DHub,DemoCamera,DHub
Device,MicroscopeID,DemoCamera,DWheel
Device,MyMic_CAM,HamamatsuHam,HamamatsuHam_DCAM
Device,XYStage,ASIStage,XYStage

